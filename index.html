<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧾 レシート読み取り（無料版）</title>
<style>
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",-apple-system,sans-serif; background:#f7f7fb; }
  #boot { padding:40px 20px; text-align:center; color:#6b7280; font-size:14px; line-height:1.8; }
</style>
</head>
<body>
<div id="app"><div id="boot">読み込み中…</div></div>

<script>
/* ── ローダー ────────────────────────────────────────────────
   このファイルは今後変更しない。アプリ本体は app.js 側にある。
   app.js は毎回ちがうURL（?t=時刻）で読むのでキャッシュされず、
   更新したら全員が次に開いた時点で自動的に最新になる。
   （＝⌘+Shift+R の案内が不要になる）
   heic-to.js は中身が変わらないので、こちらはキャッシュを効かせる。
   ──────────────────────────────────────────────────────── */
(function () {
  var s = document.createElement("script");
  s.src = "app.js?t=" + Date.now();
  s.onerror = function () {
    document.getElementById("boot").innerHTML =
      "アプリの読み込みに失敗しました。<br>通信環境を確認して、ページを再読み込みしてください。";
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
